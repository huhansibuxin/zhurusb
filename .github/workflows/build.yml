name: Build ProcGuard

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          cd $THEOS
          git submodule update --init --recursive --depth 1

      - name: Install ldid
        run: brew install ldid dpkg

      - name: Setup SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # Use Xcode SDK (supports arm64e properly)
          ln -sf $(xcrun --sdk iphoneos --show-sdk-path) $HOME/theos/sdks/iPhoneOS16.5.sdk
          echo "Linked SDK: $(readlink $HOME/theos/sdks/iPhoneOS16.5.sdk)"
        shell: bash

      - name: Build
        run: |
          export THEOS=~/theos
          chmod 755 layout/DEBIAN/postinst
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"

      - name: Raw clang build dylib (chained fixups)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CFLAGS="-isysroot $SDK -fno-objc-arc"
          # arm64e only, iOS 13.0 target to force __mod_init_func over __init_offsets
          clang -target arm64e-apple-ios13.0 $CFLAGS -c Tweak_manual.m -o /tmp/Tweak_arm64e.o
          LDFLAGS="-isysroot $SDK -dynamiclib -Wl,-fixup_chains -Wl,-undefined,dynamic_lookup -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/ProcGuard.dylib"
          clang -target arm64e-apple-ios13.0 $LDFLAGS /tmp/Tweak_arm64e.o -o /tmp/ProcGuard.dylib -framework Foundation -framework CoreFoundation -lobjc -lc++
          ldid -S /tmp/ProcGuard.dylib
          echo "=== Verify ==="
          file /tmp/ProcGuard.dylib
          otool -l /tmp/ProcGuard.dylib | grep -iE 'mod_init|init_off|CHAINED|DYLD_INFO' || true
          # Replace in deb
          DEB=$(ls packages/*.deb)
          mkdir -p /tmp/deb2
          dpkg-deb -x $DEB /tmp/deb2
          dpkg-deb -e $DEB /tmp/deb2/DEBIAN
          cp /tmp/ProcGuard.dylib /tmp/deb2/var/jb/Library/MobileSubstrate/DynamicLibraries/ProcGuard.dylib
          dpkg-deb -b /tmp/deb2 $DEB
          echo "=== final deb ==="
          ls -la $DEB

      - name: Build minimal test dylib (same flags)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CFLAGS="-isysroot $SDK -fno-objc-arc"
          clang -target arm64e-apple-ios13.0 $CFLAGS -c test_minimal.m -o /tmp/test_minimal.o
          LDFLAGS="-isysroot $SDK -dynamiclib -Wl,-fixup_chains -Wl,-undefined,dynamic_lookup"
          clang -target arm64e-apple-ios13.0 $LDFLAGS /tmp/test_minimal.o -o /tmp/test_minimal.dylib
          ldid -S /tmp/test_minimal.dylib
          echo "=== test dylib ==="
          file /tmp/test_minimal.dylib
          otool -l /tmp/test_minimal.dylib | grep -iE 'CHAINED|mod_init|init_off|BUILD_VERSION' || true
          cp /tmp/test_minimal.dylib packages/

      - name: Upload test minimal dylib
        uses: actions/upload-artifact@v4
        with:
          name: test-minimal-dylib
          path: packages/test_minimal.dylib

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ProcGuard-deb
          path: packages/*.deb
