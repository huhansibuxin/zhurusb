name: Build ProcGuard

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          cd $THEOS
          git submodule update --init --recursive --depth 1

      - name: Install ldid
        run: brew install ldid

      - name: Setup SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # Use Xcode SDK (supports arm64e properly)
          ln -sf $(xcrun --sdk iphoneos --show-sdk-path) $HOME/theos/sdks/iPhoneOS16.5.sdk
          echo "Linked SDK: $(readlink $HOME/theos/sdks/iPhoneOS16.5.sdk)"
        shell: bash

      - name: Build
        run: |
          export THEOS=~/theos
          chmod 755 layout/DEBIAN/postinst
          make package FINALPACKAGE=1 ARCHS=arm64

      - name: Rebuild dylib with raw clang
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot $SDK \
            -miphoneos-version-min=14.0 \
            -dynamiclib \
            -o /tmp/ProcGuard.dylib \
            -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/ProcGuard.dylib \
            Tweak.m
          ldid -S /tmp/ProcGuard.dylib
          echo "=== Raw clang dylib LC ==="
          jtool2 -l /tmp/ProcGuard.dylib | grep -E 'LC_DYLD'
          # Replace in deb
          DEB=$(ls packages/*.deb)
          mkdir -p /tmp/deb
          dpkg-deb -x $DEB /tmp/deb
          cp /tmp/ProcGuard.dylib /tmp/deb/var/jb/Library/MobileSubstrate/DynamicLibraries/ProcGuard.dylib
          dpkg-deb -b /tmp/deb $DEB

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ProcGuard-deb
          path: packages/*.deb
