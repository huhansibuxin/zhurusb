name: Build ProcGuard

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          cd $THEOS
          git submodule update --init --recursive --depth 1

      - name: Install ldid
        run: brew install ldid dpkg

      - name: Setup SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # Use Xcode SDK (supports arm64e properly)
          ln -sf $(xcrun --sdk iphoneos --show-sdk-path) $HOME/theos/sdks/iPhoneOS16.5.sdk
          echo "Linked SDK: $(readlink $HOME/theos/sdks/iPhoneOS16.5.sdk)"
        shell: bash

      - name: Build
        run: |
          export THEOS=~/theos
          chmod 755 layout/DEBIAN/postinst
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"

      - name: Verify dylib
        run: |
          set -e
          mkdir -p /tmp/deb
          DEB=$(ls packages/*.deb)
          dpkg-deb -x $DEB /tmp/deb
          DYLIB=/tmp/deb/var/jb/Library/MobileSubstrate/DynamicLibraries/ProcGuard.dylib
          echo "=== Size ==="
          ls -la $DYLIB
          echo "=== File ==="
          file $DYLIB
          echo "=== Load commands ==="
          otool -l $DYLIB | grep -E 'LC_DYLD_CHAINED|LC_DYLD_INFO|_RBSSet|substrate' || true
          echo "=== Symbols ==="
          nm $DYLIB | grep ' T ' | head -5

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ProcGuard-deb
          path: packages/*.deb
