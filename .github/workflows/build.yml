name: Build ProcGuard

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          cd $THEOS
          git submodule update --init --recursive --depth 1

      - name: Install ldid
        run: brew install ldid dpkg

      - name: Setup SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # Use Xcode SDK (supports arm64e properly)
          ln -sf $(xcrun --sdk iphoneos --show-sdk-path) $HOME/theos/sdks/iPhoneOS16.5.sdk
          echo "Linked SDK: $(readlink $HOME/theos/sdks/iPhoneOS16.5.sdk)"
        shell: bash

      - name: Build
        run: |
          export THEOS=~/theos
          chmod 755 layout/DEBIAN/postinst
          make package FINALPACKAGE=1 ARCHS=arm64

      - name: Rebuild dylib with raw clang (FAT arm64+arm64e)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CFLAGS="-isysroot $SDK -miphoneos-version-min=14.0 -dynamiclib -Wl,-fixup_chains -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/ProcGuard.dylib"
          clang -arch arm64  $CFLAGS -o /tmp/ProcGuard_arm64.dylib  Tweak.m
          clang -arch arm64e $CFLAGS -o /tmp/ProcGuard_arm64e.dylib Tweak.m
          lipo -create /tmp/ProcGuard_arm64.dylib /tmp/ProcGuard_arm64e.dylib -output /tmp/ProcGuard.dylib
          ldid -S /tmp/ProcGuard.dylib
          file /tmp/ProcGuard.dylib
          echo "=== Verify chained fixups & mod_init_func ==="
          otool -l /tmp/ProcGuard.dylib | grep -E 'LC_DYLD|mod_init|init_off' || true
          # Replace in deb
          DEB=$(ls packages/*.deb)
          mkdir -p /tmp/deb
          dpkg-deb -x $DEB /tmp/deb
          dpkg-deb -e $DEB /tmp/deb/DEBIAN
          cp /tmp/ProcGuard.dylib /tmp/deb/var/jb/Library/MobileSubstrate/DynamicLibraries/ProcGuard.dylib
          dpkg-deb -b /tmp/deb $DEB

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ProcGuard-deb
          path: packages/*.deb
